<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../pages/common.css">
  <style>
    body { width: 280px; }
    main { padding: 18px 16px; }
    .brand { margin-bottom: 14px; }
    .big { font-size: 2.6rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .status { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    button { width: 100%; }
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="../icons/32.png" alt=""><span>Rempart</span></div>
  <div class="big" id="days">0</div>
  <div class="muted" id="days-label"></div>
  <div class="status"><span class="dot"></span><span data-i18n="protectionOn"></span></div>
  <p class="small muted" id="count"></p>
  <p class="small muted hidden" id="unlocked"></p>
  <button class="secondary" id="options" data-i18n="openSettings"></button>
</main>
<script src="../pages/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
